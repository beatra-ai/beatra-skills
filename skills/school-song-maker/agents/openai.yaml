interface:
  display_name: "School Song Maker"
  short_description: "Turn your school, class, motto, and memories into original lyrics and a sing-along class song, graduation song, or welcome song."
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.svg"
